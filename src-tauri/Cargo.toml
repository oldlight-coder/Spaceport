[package]
name = "spaceport"
version = "0.1.0"
description = "Standalone desktop Stremio client"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "spaceport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
flate2 = "1"
base64 = "0.22"
libloading = "0.8"
# Torrent engine. Its default TLS feature would build aws-lc from C; Spaceport's reqwest already
# brings TLS, so only a SHA-1 backend is chosen, per platform below.
librqbit = { version = "9.0.1", default-features = false }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
rand = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
url = "2"
# Without platform features keyring falls back to an in-memory mock store, which keeps
# non-Windows dev builds and tests compiling. Windows uses the Credential Manager.
keyring = "3"

# HTTPS: the system's TLS on Windows (and Linux dev builds); on Android, where there is no such
# library to link, rustls with the ring crypto provider and Mozilla's root certificates.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }
# SHA-1 for torrents from the system's crypto (Windows CNG; OpenSSL on Linux dev builds).
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-crypto-hash"] }
librqbit-sha1-wrapper = { version = "9.0.1", default-features = false, features = ["sha1-crypto-hash"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1"
# Android has no OpenSSL to link: SHA-1 for torrents from aws-lc instead.
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
librqbit-sha1-wrapper = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
