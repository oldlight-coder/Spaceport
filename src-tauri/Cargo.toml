[package]
name = "spaceport"
version = "0.1.0"
description = "Standalone desktop Stremio client"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "spaceport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
libloading = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }
# Without platform features keyring falls back to an in-memory mock store, which keeps
# non-Windows dev builds and tests compiling. Windows uses the Credential Manager.
keyring = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
