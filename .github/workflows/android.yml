# Builds the Android app (a debug APK) on GitHub's runners, which come with the Android SDK and
# NDK. It only compiles: the APK is debug-signed and kept as a download for testing; release
# builds are signed on the owner's computer with the owner's key.
name: Android build

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The Gradle wrapper jar in the repository must be an official one.
      - uses: gradle/actions/wrapper-validation@v4

      # The checksum Gradle publishes for the distribution the wrapper downloads, so it can be
      # pinned in gradle-wrapper.properties (distributionSha256Sum).
      - name: Gradle distribution checksum
        run: |
          url=$(grep '^distributionUrl=' src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's#\\##g')
          echo "distribution: $url"
          echo "sha256: $(curl -sSfL "$url.sha256")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build debug APK (arm64)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: pnpm tauri android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: spaceport-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
